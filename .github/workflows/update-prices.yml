name: Update prices

on:
  schedule:
    # Weekdays at 21:30 UTC: 5:30 pm Toronto in summer, 4:30 pm in winter (after the TSX and NYSE close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch prices and recalculate weights
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python scripts/update_prices.py
      - name: Commit if anything changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add site/data/live.json
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "Update prices $(date -u +%F)"
            git push
          fi
